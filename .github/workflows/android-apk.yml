name: Android APK
run-name: Build Agents for Life APK • UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install provided app icon
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d icon_base64.txt > app/src/main/res/drawable-nodpi/ic_launcher_agents_image.webp
          test -s app/src/main/res/drawable-nodpi/ic_launcher_agents_image.webp
          file app/src/main/res/drawable-nodpi/ic_launcher_agents_image.webp
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp app/src/main/res/drawable-nodpi/ic_launcher_agents_image.webp app/src/main/res/mipmap-anydpi-v26/ic_launcher.webp

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: android
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Agents-for-Life.apk

      - name: Enable KVM for Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Cache Android 11 AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-x86_64-pixel2-v2

      - name: Create Android 11 AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: echo "Android 11 AVD snapshot created for cache."

      - name: Android 11 startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: bash android/smoke-test.sh

      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-for-life-startup-log
          path: android-startup-log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-for-life-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Agents for Life APK
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Agents-for-Life.apk
