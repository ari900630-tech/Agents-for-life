<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Agents for Life</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header><div><div class="eyebrow">AI AGENTS</div><h1>Agents for Life</h1><p>כותבים מה צריך — הסוכן מבצע.</p></div><span id="status" class="status">בודק חיבור…</span></header><section class="grid"><aside class="panel agents"><div class="panel-title"><h2>הסוכנים שלי</h2><button id="newAgent">+ סוכן</button></div><div id="agentList"></div></aside><section class="panel workspace"><div id="agentHeader" class="agent-header"></div><label for="task">מה אתה רוצה שהסוכן יעשה?</label><textarea id="task" rows="6" placeholder="לדוגמה: חפש את 5 האפשרויות הטובות ביותר ל... וסכם לי אותן בטבלה."></textarea><div class="options"><label><input id="webSearch" type="checkbox"> לאפשר חיפוש באינטרנט</label><button id="run" class="primary">הפעל סוכן</button></div><div id="result" class="result empty">התוצאה תופיע כאן.</div></section></section><section class="panel history"><div class="panel-title"><h2>היסטוריה</h2><button id="clearHistory" class="ghost">נקה</button></div><div id="history"></div></section></main><dialog id="agentDialog"><form method="dialog" id="agentForm"><h2>סוכן חדש</h2><input id="agentName" required placeholder="שם הסוכן"><textarea id="agentInstructions" required rows="5" placeholder="מה הסוכן יודע לעשות? לדוגמה: אתה מומחה למחקר, משווה מקורות ומציג מסקנות קצרות."></textarea><label><input id="agentWeb" type="checkbox"> לאפשר חיפוש באינטרנט כברירת מחדל</label><div class="dialog-actions"><button value="cancel" class="ghost">ביטול</button><button id="saveAgent" value="default" class="primary">שמור סוכן</button></div></form></dialog><script src="/app.js"></script></body></html>
