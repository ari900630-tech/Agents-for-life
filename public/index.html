<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Agents for Life</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell">
<header><div><div class="eyebrow">AI AGENTS PLATFORM</div><h1>Agents for Life</h1><p>בונים סוכן, כותבים או מדברים — והוא עובד.</p></div><span id="status" class="status">בודק חיבור…</span></header>
<section class="stats"><div><b id="agentCount">0</b><span>הסוכנים שלי</span></div><div><b id="templateCount">0</b><span>תבניות</span></div><div><b id="taskCount">0</b><span>משימות</span></div></section>
<section class="panel library"><div class="panel-title"><div><h2>בנה סוכן</h2><p>בחר תבנית או צור סוכן מאפס.</p></div><button id="newAgent">+ סוכן חדש</button></div><div id="templateList" class="templates"></div></section>
<section class="grid"><aside class="panel agents"><div class="panel-title"><h2>הסוכנים שלי</h2></div><div id="agentList"></div></aside>
<section class="panel workspace"><div id="agentHeader" class="agent-header"></div><label for="task">מה אתה רוצה שהסוכן יעשה?</label><textarea id="task" rows="7" placeholder="כתוב משימה או לחץ על 🎙️ ודבר. הטקסט יירשם אוטומטית לצ'אט."></textarea><div class="voice-row"><button id="voiceInput" type="button" class="voice-button" aria-pressed="false">🎙️ דבר עכשיו</button><span id="voiceStatus">אפשר לדבר במקום להקליד</span></div><div class="options"><label><input id="webSearch" type="checkbox"> לאפשר חיפוש באינטרנט</label><div><button id="duplicate" class="ghost">שכפל</button><button id="deleteAgent" class="danger">מחק</button><button id="run" class="primary">הפעל סוכן</button></div></div><div id="result" class="result empty">התוצאה תופיע כאן.</div></section></section>
<section class="panel history"><div class="panel-title"><h2>היסטוריית משימות</h2><button id="clearHistory" class="ghost">נקה</button></div><div id="history"></div></section>
</main>
<dialog id="agentDialog"><form method="dialog" id="agentForm"><h2>סוכן חדש</h2><input id="agentName" required placeholder="שם הסוכן"><textarea id="agentInstructions" required rows="6" placeholder="הוראות הסוכן: תפקיד, סגנון, כללים ומה עליו לבצע."></textarea><label><input id="agentWeb" type="checkbox"> חיפוש באינטרנט כברירת מחדל</label><div class="dialog-actions"><button value="cancel" class="ghost">ביטול</button><button id="saveAgent" value="default" class="primary">שמור סוכן</button></div></form></dialog>
<script src="/app.js"></script></body></html>
